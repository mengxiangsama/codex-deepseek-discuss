[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-deepseek-discuss"
version = "0.1.0"
description = "Bring DeepSeek second opinions into the same Codex conversation via MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "mengxiangsama"}]
dependencies = ["mcp>=1.12,<2", "httpx[socks]>=0.28,<1"]

[project.scripts]
codex-deepseek = "codex_deepseek.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_deepseek = ["*.swift"]
